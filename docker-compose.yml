services:
  # ---------------------------------------------------------------------------
  # Backend Laravel — PHP-FPM (igual que producción)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./api-layerbase:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - layerbase
    # No expone puertos: Nginx habla con él por la red interna (app:9000).

  # ---------------------------------------------------------------------------
  # Base de datos PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: layerbase
      POSTGRES_USER: layerbase
      POSTGRES_PASSWORD: LayerBase_2026
    ports:
      # Expuesto en 5432 por si quieres conectar un cliente desde el host.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layerbase -d layerbase"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - layerbase

  # ---------------------------------------------------------------------------
  # Servidor web Nginx — sirve el backend en http://localhost:8000
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./api-layerbase:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - layerbase

  # ---------------------------------------------------------------------------
  # Frontend Vite (React) — http://localhost:5173
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend-layerbase
      dockerfile: ../docker/frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      # El proxy de Vite corre dentro del contenedor, así que /api se redirige
      # al servicio nginx por la red interna, no a localhost.
      VITE_PROXY_TARGET: http://nginx:80
      # Mejora la detección de cambios en volúmenes montados (macOS/Windows).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend-layerbase:/app
      # Volumen anónimo para conservar el node_modules instalado en la imagen.
      - /app/node_modules
    depends_on:
      - nginx
    networks:
      - layerbase

  # ---------------------------------------------------------------------------
  # Mailpit — servidor SMTP de desarrollo
  # ---------------------------------------------------------------------------
  # Captura TODO el correo que manda la aplicación y lo enseña en una bandeja
  # de entrada web. Nada sale a internet: se pueden probar verificaciones y
  # notificaciones sin riesgo de escribir a direcciones reales.
  #
  # Sustituye al driver `log`, que obligaba a rebuscar el enlace de
  # verificación entre las líneas del fichero de log.
  #
  # SOLO desarrollo. En producción va un proveedor real (Resend, Postmark,
  # SES) con SPF y DKIM configurados en el DNS, o los correos acaban en spam.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      # 8025 = bandeja web. 1025 = SMTP, al que apunta MAIL_PORT.
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - layerbase

networks:
  layerbase:
    driver: bridge

volumes:
  pgdata:
