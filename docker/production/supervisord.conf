; -----------------------------------------------------------------------------
; Supervisor: mantiene Nginx y PHP-FPM vivos dentro del mismo contenedor.
;
; App Runner ejecuta UN proceso por contenedor y lo reinicia si muere, pero aquí
; hacen falta dos. Sin un supervisor, si PHP-FPM cae el contenedor sigue en pie
; con Nginx respondiendo 502 a todo: vivo para la plataforma, inútil para quien
; entra. Con `autorestart` + `exitcodes`, la muerte de cualquiera de los dos
; tumba el contenedor y App Runner levanta una instancia sana.
; -----------------------------------------------------------------------------

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Si un programa agota sus reintentos, se acaba el contenedor entero.
[eventlistener:muerte]
command=sh -c "printf 'READY\n'; while read line; do kill -SIGQUIT $PPID; done < /dev/stdin"
events=PROCESS_STATE_FATAL
