; -----------------------------------------------------------------------------
; Pool de PHP-FPM para App Runner.
;
; App Runner escala por instancias, no por procesos: la concurrencia se ajusta
; en la configuración del servicio. Un pool enorme dentro de un contenedor de
; 512 MB solo sirve para que el sistema se quede sin memoria antes de que Cloud
; Run se entere de que hay que escalar. De ahí un pool corto y estático.
; -----------------------------------------------------------------------------

[www]
listen = 127.0.0.1:9000

pm = static
pm.max_children = 8
pm.max_requests = 500

; Los logs de PHP a stderr, que es de donde los recoge App Runner.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

clear_env = no
