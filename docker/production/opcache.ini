; -----------------------------------------------------------------------------
; OPcache en producción.
;
; `validate_timestamps=0` es lo que más rinde y aquí además es seguro: el código
; se copia dentro de la imagen y no cambia nunca en caliente. Un despliegue crea
; un contenedor nuevo, así que no hay nada que revalidar.
; -----------------------------------------------------------------------------

opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.jit=tracing
opcache.jit_buffer_size=64M
