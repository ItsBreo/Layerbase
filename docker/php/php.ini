; -----------------------------------------------------------------------------
; Ajustes de PHP compartidos por desarrollo y producción.
;
; Sin este fichero PHP usa sus valores por defecto compilados, y ahí
; `upload_max_filesize` vale 2M — menos que los 5 MB que la aplicación valida en
; `UploadComponentFileRequest::MAX_KB`. El efecto era una subida de entre 2 y
; 5 MB rechazada por PHP ANTES de llegar a Laravel: `$_FILES` llega vacío y el
; autor recibe "el archivo es obligatorio" en vez de "pesa demasiado".
;
; `post_max_size` va por encima de `upload_max_filesize` a propósito: el cuerpo
; de la petición lleva además los campos del formulario y las cabeceras de
; multipart, así que igualarlos volvería a cortar en el límite justo.
; -----------------------------------------------------------------------------

upload_max_filesize = 8M
post_max_size = 12M
memory_limit = 256M

; Un ZIP de 8 MB por una red lenta tarda más que los 30 s por defecto.
max_execution_time = 60
max_input_time = 60

; Nunca revelar la versión de PHP en las cabeceras de respuesta.
expose_php = Off
