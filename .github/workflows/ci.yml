name: CI

# Se ejecuta en cada push a las ramas troncales y en toda PR contra ellas.
# Hasta ahora nada corría la suite automáticamente: dependía de que alguien se
# acordase de lanzarla a mano.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Una PR con varios push seguidos solo mantiene la ejecución más reciente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-layerbase

    # La suite corre contra PostgreSQL, el mismo motor que producción. Antes
    # usaba SQLite en memoria: más rápido de arrancar, pero con otro orden de
    # NULL y sin búsqueda de texto completo, así que había tests en verde que no
    # probaban lo que decían probar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: layerbase_testing
          POSTGRES_USER: layerbase
          POSTGRES_PASSWORD: LayerBase_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U layerbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Las variables de entorno del job ganan al .env: Laravel carga dotenv en
    # modo inmutable, así que no pisa lo que ya existe en el entorno. Por eso
    # `DB_HOST=db` del .env.example no rompe aquí.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: layerbase_testing
      DB_USERNAME: layerbase
      DB_PASSWORD: LayerBase_2026

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, zip, gd, intl
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: api-layerbase/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('api-layerbase/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo de código (Pint)
        run: ./vendor/bin/pint --test

      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-layerbase

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-layerbase/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` es `tsc -b && vite build`, así que cubre a la vez los
      # tipos y que el bundle se genere.
      - name: Tipos y build
        run: npm run build
